<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4E5C6A">
  <meta name="robots" content="noindex">
  <title>IRON77 Demo Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #4E5C6A; --card: #3C4753; --well: #2F3943; --ink: #E7E7E1; --label: #C3CCD4; --accent: #39B4F2; --red: #E8343B; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 'IBM Plex Mono', ui-monospace, monospace; }
    main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
    h1 { font: 400 26px/1.15 'Archivo Black', system-ui, sans-serif; margin: 0 0 6px; }
    h2 { font: 400 18px 'Archivo Black', system-ui, sans-serif; margin: 0 0 10px; }
    p { margin: 6px 0; color: var(--label); }
    a { color: var(--accent); }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin: 14px 0; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pair figure { margin: 0; }
    .pair figcaption { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--label); margin-top: 6px; }
    .frame { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--well); }
    .frame img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .photo img { object-fit: cover; }
    .photo .f2 { animation: flip 2.4s steps(1, end) infinite; }
    @keyframes flip { 0% { opacity: 0; } 50% { opacity: 1; } }
    .gif { background: #fff; }
    .gif img { object-fit: contain; }
    .gif.dark { background: var(--well); }
    .gif.dark img { mix-blend-mode: screen; filter: invert(1) hue-rotate(180deg); }
    .seg { display: flex; gap: 4px; background: var(--well); border-radius: 10px; padding: 4px; margin-top: 12px; }
    .seg button { flex: 1; border: 0; background: none; color: var(--label); padding: 9px; border-radius: 7px; font: 500 12px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .08em; }
    .seg button.on { background: var(--ink); color: #33658C; }
    .back { display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>
<main>
  <h1>Demo test</h1>
  <p><b style="color:var(--ink)">Left:</b> current photos (free-exercise-db), two frames.<br><b style="color:var(--ink)">Right:</b> ExerciseDB free GIFs, 180×180, full motion.</p>
  <div class="seg" role="group" aria-label="GIF background">
    <button class="on" data-bg="white">GIFs on white</button>
    <button data-bg="dark">GIFs on dark</button>
  </div>
  <div id="list"></div>
  <a class="back" href="./">← Back to IRON77</a>
</main>
<script>
  const PHOTO = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
  const GIF = 'https://static.exercisedb.dev/media/';
  const ROWS = [
    ['Bench Press', 'Barbell_Bench_Press_-_Medium_Grip', 'EIeI8Vf'],
    ['Barbell Curl', 'Barbell_Curl', '25GPyDY'],
    ['DB Lateral Raise', 'Side_Lateral_Raise', 'DsgkuIt'],
    ['Deadlift', 'Barbell_Deadlift', 'ila4NZS'],
    ['Lat Pulldown', 'Wide-Grip_Lat_Pulldown', 'LEprlgG'],
  ];
  document.getElementById('list').innerHTML = ROWS.map(([name, photo, gif]) => `
    <section class="card"><h2>${name}</h2>
      <div class="pair">
        <figure><div class="frame photo"><img src="${PHOTO}${photo}/0.jpg" alt="${name} start"><img class="f2" src="${PHOTO}${photo}/1.jpg" alt="${name} finish"></div><figcaption>Current photos</figcaption></figure>
        <figure><div class="frame gif"><img src="${GIF}${gif}.gif" alt="${name} animation"></div><figcaption>ExerciseDB GIF</figcaption></figure>
      </div>
    </section>`).join('');
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.gif').forEach((g) => g.classList.toggle('dark', b.dataset.bg === 'dark'));
  });
</script>
</body>
</html>
