<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Golden-era bodybuilding: Heavy Duty, classic programs, era nutrition and supplements.">
  <title>IRON77</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>
  <div id="timer" class="timer" hidden><span>REST</span><span class="t">0:00</span><button data-act="stoptimer" aria-label="Stop timer">✕</button></div>
  <div id="toast" class="toast" role="status"></div>
  <nav>
    <button data-act="go" data-v="today"><i>◉</i>Today</button>
    <button data-act="go" data-v="train"><i>▮▬▮</i>Train</button>
    <button data-act="go" data-v="fuel"><i>◆</i>Fuel</button>
    <button data-act="go" data-v="stack"><i>⬢</i>Stack</button>
    <button data-act="go" data-v="legends"><i>★</i>Legends</button>
  </nav>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
